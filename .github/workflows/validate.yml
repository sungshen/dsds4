name: Validate data pipeline and platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-viirs.txt
            requirements-viirs-s3.txt
            platform/requirements.txt
      - run: python -m pip install -r requirements-viirs-s3.txt -r platform/requirements.txt
      - run: python -m unittest discover -s . -p 'test_*.py'
      - run: python -I scripts/test_ngii_delivery_inventory.py
      - run: python scripts/gk2a_delivery_inventory.py --self-test
      - run: python scripts/build_data_handoff.py --check
      - run: python -m compileall -q -x '/(\.git|data)/' .
      - run: node --check platform/static/app.js

  cnn-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r sideprojects/gk2a_rain_cnn/requirements.txt
      - run: python -m unittest discover -s sideprojects/gk2a_rain_cnn -p 'test_*.py' -v
